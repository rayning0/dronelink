<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>DroneLink - Drone Camera</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 800px;
      margin: 40px auto;
    }

    video {
      width: 100%;
      background: #111;
      border-radius: 8px;
    }

    button {
      padding: 10px 16px;
      margin: 12px 8px 12px 0;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>
  <h1>DroneLink: Simulated Drone Camera</h1>
  <p id="status">Not connected</p>

  <button id="join">Join as drone camera</button>
  <button id="leave" disabled>Leave</button>

  <video id="preview" autoplay muted playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
  <script src="/common.js"></script>
  <script src="/drone.js"></script>
</body>

</html>
